[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions/assets/AtkinsonHyperlegible-OFL.txt"

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200
  force = true

[[redirects]]
  from = "/api/images"
  to = "/.netlify/functions/images"
  status = 200
  force = true

[[redirects]]
  from = "/api/article"
  to = "/.netlify/functions/article"
  status = 200
  force = true

[[redirects]]
  from = "/api/image-proxy"
  to = "/.netlify/functions/image-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/automation"
  to = "/.netlify/functions/automation-settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/automation-image"
  to = "/.netlify/functions/automation-latest-image"
  status = 200
  force = true

[functions."automation-tick"]
  schedule = "0 * * * *"

[functions."automation-run-background"]
  background = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
